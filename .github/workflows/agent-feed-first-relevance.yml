name: Apply feed-first relevance update

on:
  push:
    branches:
      - agent/feed-first-relevance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/feed-first-relevance
          fetch-depth: 0

      - name: Apply focused source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          main = "artflow/webapp/src/main.jsx"
          replace_once(
              main,
              'window.__APIX_MINIAPP_BUILD_ID__ = "20260731-trend-category-home-v4";',
              'window.__APIX_MINIAPP_BUILD_ID__ = "20260731-feed-first-relevance-v1";',
          )
          replace_once(
              main,
              '''  const onBack = () => {
              if (screen === "home") tg()?.close?.();
              else setScreen("home");
            };''',
              '''  const onBack = () => {
              if (screen === "feed") tg()?.close?.();
              else setScreen("feed");
            };''',
          )
          replace_once(
              main,
              '{screen === "home" ? "✕ Закрыть" : "‹ Назад"}',
              '{screen === "feed" ? "✕ Закрыть" : "‹ Назад"}',
          )
          replace_once(
              main,
              '''  const tabs = [
              ["home", "⌂", "Главная", ""],
              ["feed", "▤", "Лента", ""],
              ["studio", "+", "Создать", "navCreate"],''',
              '''  const tabs = [
              ["feed", "▤", "Лента", ""],
              ["home", "🔥", "Тренды", ""],
              ["studio", "+", "Создать", "navCreate"],''',
          )
          replace_once(
              main,
              '<p>{filtered.length} {filtered.length === 1 ? "работа" : "работ"}</p>',
              '<p>{filtered.length} {filtered.length === 1 ? "работа" : "работ"} · свежесть, популярность, повторы</p>',
          )
          replace_once(
              main,
              '  const [screen, setScreen] = useState("home");',
              '  const [screen, setScreen] = useState("feed");',
          )
          replace_once(
              main,
              '  const feed = useApi(() => api("/feed?source=recent&limit=10000").then(items), fallbackFeed);',
              '  const feed = useApi(() => api("/feed?source=relevant&limit=200").then(items), fallbackFeed);',
          )
          replace_once(
              main,
              '        {screens[screen] || screens.home}',
              '        {screens[screen] || screens.feed}',
          )

          routes = "artflow/api/miniapp_routes.py"
          replace_once(
              routes,
              '    source: str = Query(default="recent", pattern="^(recent|top_day|top)$"),',
              '    source: str = Query(default="relevant", pattern="^(relevant|recent|top_day|top)$"),',
          )
          replace_once(
              routes,
              '''        "remixes": card.remix_count,
              "score": getattr(card, "score", 0),''',
              '''        "remixes": card.remix_count,
              "created_at": generation.created_at.isoformat() if generation.created_at else "",
              "score": getattr(card, "score", 0),''',
          )

          repository = "artflow/db/repository.py"
          replace_once(repository, "import logging\n", "import logging\nimport math\n")
          replace_once(
              repository,
              '''def _feed_score(gen: Generation, remix_count: int) -> float:
              generation_count = 1 + remix_count
              score = (
                  gen.likes_count * 1
                  + remix_count * 3
                  + gen.shares_count * 5
                  + generation_count * 4
              )
              created_at = gen.created_at
              if created_at and created_at.tzinfo is None:
                  created_at = created_at.replace(tzinfo=timezone.utc)
              if created_at and (datetime.now(timezone.utc) - created_at).total_seconds() <= 2 * 60 * 60:
                  score *= 1.5
              return float(score)
          ''',
              '''def _feed_score(
              gen: Generation,
              remix_count: int,
              *,
              now: datetime | None = None,
          ) -> float:
              """Rank public work by freshness, popularity and repeat intent.

              Engagement is logarithmic so one viral post cannot permanently occupy
              the first position. The engagement contribution decays with age, while
              every new post receives a temporary freshness opportunity.
              """
              ranking_now = now or datetime.now(timezone.utc)
              created_at = gen.created_at or ranking_now
              if created_at.tzinfo is None:
                  created_at = created_at.replace(tzinfo=timezone.utc)

              age_hours = max(0.0, (ranking_now - created_at).total_seconds() / 3600)
              likes = max(0, int(gen.likes_count or 0))
              shares = max(0, int(gen.shares_count or 0))
              repeats = max(0, int(remix_count or 0))

              freshness = 12.0 / ((age_hours + 2.0) ** 0.72)
              popularity = math.log1p(likes) * 2.2 + math.log1p(shares) * 3.0
              repeat_intent = math.log1p(repeats) * 5.0
              age_decay = 1.0 / ((age_hours / 24.0) + 1.0) ** 0.55
              return float(freshness + (popularity + repeat_intent) * age_decay)
          ''',
          )
          replace_once(
              repository,
              '''    cards: list[FeedGenerationCard] = []
              for gen, username, full_name, author_photo_url, aspect_ratio, quality, count, reference_url, reference_urls, remix_count in result.all():''',
              '''    cards: list[FeedGenerationCard] = []
              ranking_now = datetime.now(timezone.utc)
              for gen, username, full_name, author_photo_url, aspect_ratio, quality, count, reference_url, reference_urls, remix_count in result.all():''',
          )
          replace_once(
              repository,
              '                score=_feed_score(gen, remix_total),',
              '                score=_feed_score(gen, remix_total, now=ranking_now),',
          )
          replace_once(
              repository,
              '''async def get_feed_generations(
              session: AsyncSession,
              *,
              limit: int = 100,
          ) -> list[FeedGenerationCard]:
              stmt = (
                  select(Generation)
                  .where(
                      Generation.gen_type.in_((GenerationType.image, GenerationType.video)),
                      Generation.status == GenerationStatus.done,
                      Generation.result_url.is_not(None),
                      Generation.is_public_feed.is_(True),
                  )
                  .order_by(desc(Generation.created_at))
                  .limit(max(limit, 1) * 3)
              )
              cards = await _feed_cards_from_stmt(session, stmt)
              return cards[:limit]
          ''',
              '''async def get_feed_generations(
              session: AsyncSession,
              *,
              limit: int = 100,
          ) -> list[FeedGenerationCard]:
              normalized_limit = max(limit, 1)
              candidate_limit = min(max(normalized_limit * 8, 400), 20_000)
              stmt = (
                  select(Generation)
                  .where(
                      Generation.gen_type.in_((GenerationType.image, GenerationType.video)),
                      Generation.status == GenerationStatus.done,
                      Generation.result_url.is_not(None),
                      Generation.is_public_feed.is_(True),
                  )
                  .order_by(desc(Generation.created_at))
                  .limit(candidate_limit)
              )
              cards = await _feed_cards_from_stmt(session, stmt)
              return cards[:normalized_limit]
          ''',
          )

          test_path = Path("artflow/tests/test_feed_first_relevance.py")
          test_path.write_text('''from __future__ import annotations

          from datetime import datetime, timedelta, timezone
          from types import SimpleNamespace

          from db.repository import _feed_score


          def _generation(*, age_hours: float, likes: int = 0, shares: int = 0):
              now = datetime(2026, 7, 31, 20, 0, tzinfo=timezone.utc)
              return SimpleNamespace(
                  created_at=now - timedelta(hours=age_hours),
                  likes_count=likes,
                  shares_count=shares,
              ), now


          def test_newer_work_gets_freshness_opportunity():
              recent, now = _generation(age_hours=1)
              old, _ = _generation(age_hours=72)
              assert _feed_score(recent, 0, now=now) > _feed_score(old, 0, now=now)


          def test_popularity_improves_relevance_at_equal_age():
              plain, now = _generation(age_hours=12)
              popular, _ = _generation(age_hours=12, likes=20, shares=4)
              assert _feed_score(popular, 0, now=now) > _feed_score(plain, 0, now=now)


          def test_repeats_are_a_strong_relevance_signal():
              plain, now = _generation(age_hours=12)
              assert _feed_score(plain, 8, now=now) > _feed_score(plain, 0, now=now)


          def test_frontend_opens_relevant_feed_first():
              source = open("webapp/src/main.jsx", encoding="utf-8").read()
              routes = open("api/miniapp_routes.py", encoding="utf-8").read()

              assert 'useState("feed")' in source
              assert '/feed?source=relevant&limit=200' in source
              assert source.index('["feed", "▤", "Лента", ""]') < source.index('["home", "🔥", "Тренды", ""]')
              assert "свежесть, популярность, повторы" in source
              assert 'default="relevant"' in routes
              assert '"created_at": generation.created_at.isoformat()' in routes
          ''', encoding="utf-8")

          trend_test = Path("artflow/tests/test_trend_category_home.py")
          text = trend_test.read_text(encoding="utf-8")
          old = 'assert "trend-category-home-v4" in source'
          new = 'assert "feed-first-relevance-v1" in source'
          if text.count(old) != 1:
              raise SystemExit("trend category build-id assertion not found")
          trend_test.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate focused tests
        working-directory: artflow
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          pytest -q tests/test_feed_first_relevance.py tests/test_trend_category_home.py

      - name: Commit applied update
        shell: bash
        run: |
          rm -f .github/workflows/agent-feed-first-relevance.yml
          git config user.name "APIX Agent"
          git config user.email "actions@users.noreply.github.com"
          git add artflow/webapp/src/main.jsx artflow/api/miniapp_routes.py artflow/db/repository.py artflow/tests/test_feed_first_relevance.py artflow/tests/test_trend_category_home.py .github/workflows/agent-feed-first-relevance.yml
          git commit -m "feat: make relevant feed the first screen [feed-first-applied]"
          git push origin HEAD:agent/feed-first-relevance
