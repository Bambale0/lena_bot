name: Integrate Trends PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/integrate-trends'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-trends
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply trends integration
        run: python artflow/scripts/integrate_trends_once.py

      - name: Compile bot changes
        run: python -m compileall -q artflow/bot/ui/main_menu.py artflow/bot/keyboards/feed.py artflow/bot/handlers/feed.py

      - name: Run trends contract tests
        run: |
          python -m pip install --quiet pytest
          pytest -q artflow/tests/test_trends_surface.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: artflow/webapp/package-lock.json

      - name: Build Mini App
        working-directory: artflow/webapp
        run: |
          npm ci
          npm run build

      - name: Commit integrated feature
        run: |
          rm -f .github/workflows/integrate-trends-once.yml
          rm -f .github/workflows/integrate-trends-pr.yml
          rm -f artflow/scripts/integrate_trends_once.py
          rm -f artflow/.trends-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate trends in bot and mini app"
          git push origin HEAD:agent/integrate-trends
