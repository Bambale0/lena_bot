name: Fix Compact Feed Media

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/compact-feed-tiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compact-feed-tiles
          fetch-depth: 0

      - name: Apply media handling fix
        run: |
          python3 .github/scripts/fix_compact_feed_media.py
          ! grep -q 'const mediaType =' artflow/webapp/src/main.jsx
          grep -Fq 'type={/\.(mp4|webm|mov)(?:$|\?)/i.test(url) ? "video" : "image"}' artflow/webapp/src/main.jsx
          ! grep -q '.feedCompactMedia video{pointer-events:none}' artflow/webapp/src/style.css

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: artflow/webapp/package-lock.json

      - name: Build Mini App
        working-directory: artflow/webapp
        run: |
          npm ci
          npm run build

      - name: Keep generated dist out of source diff
        run: git checkout -- artflow/webapp/dist || true

      - name: Commit fix
        run: |
          rm -f .github/scripts/fix_compact_feed_media.py .github/workflows/fix-compact-feed-media.yml
          git config user.name 'APIX Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add artflow/webapp/src/main.jsx artflow/webapp/src/style.css .github
          git commit -m 'fix: preserve video preview compatibility'
          git push origin HEAD:agent/compact-feed-tiles
