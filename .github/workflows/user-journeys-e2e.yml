name: 300 User Journey E2E

on:
  pull_request:
    paths:
      - "artflow/api/__init__.py"
      - "artflow/api/feed_repeat_contract.py"
      - "artflow/webapp/**"
      - ".github/workflows/user-journeys-e2e.yml"
  push:
    branches: [main]
    paths:
      - "artflow/api/__init__.py"
      - "artflow/api/feed_repeat_contract.py"
      - "artflow/webapp/**"
      - ".github/workflows/user-journeys-e2e.yml"
  workflow_dispatch:

concurrency:
  group: user-journeys-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artflow/webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: artflow/webapp/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npm run test:e2e:install

      - name: Typecheck and build
        run: npm run build

      - name: Run exactly 300 user journeys
        run: npm run test:e2e:user-journeys

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: user-journeys-playwright-failures
          path: |
            artflow/webapp/test-results
            artflow/webapp/playwright-report
          if-no-files-found: ignore
          retention-days: 7
