name: Feed Security Contracts

on:
  pull_request:
    paths:
      - "artflow/api/web/auth_rate_limit_guard.py"
      - "artflow/core/password_rate_limit.py"
      - "artflow/core/request_identity.py"
      - "artflow/db/feed_engagement.py"
      - "artflow/db/feed_engagement_guard.py"
      - "artflow/db/session.py"
      - "artflow/bot/middlewares/db.py"
      - "artflow/db/migrations/versions/030_feed_engagements.py"
      - "artflow/tests/test_feed_engagement_security.py"
      - "artflow/tests/test_password_rate_limit_redis.py"
      - "artflow/tests/test_repository_feed.py"
      - ".github/workflows/security-feed-rate-limit.yml"
  push:
    branches: [main]
    paths:
      - "artflow/api/web/auth_rate_limit_guard.py"
      - "artflow/core/password_rate_limit.py"
      - "artflow/core/request_identity.py"
      - "artflow/db/feed_engagement.py"
      - "artflow/db/feed_engagement_guard.py"
      - "artflow/db/session.py"
      - "artflow/bot/middlewares/db.py"
      - "artflow/db/migrations/versions/030_feed_engagements.py"
      - "artflow/tests/test_feed_engagement_security.py"
      - "artflow/tests/test_password_rate_limit_redis.py"
      - "artflow/tests/test_repository_feed.py"
      - ".github/workflows/security-feed-rate-limit.yml"

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow
    env:
      BOT_TOKEN: "123456:ci-security"
      BOT_USERNAME: "TestBot"
      WEBHOOK_URL: "https://example.test"
      WEBHOOK_SECRET: "ci-security-secret"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/ci"
      REDIS_URL: "redis://localhost:6379/0"
      COMET_API_KEY: "ci-security-comet"
      ENV: "test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff security changes
        run: |
          ruff check \
            api/web/auth_rate_limit_guard.py \
            core/password_rate_limit.py \
            core/request_identity.py \
            db/feed_engagement.py \
            db/feed_engagement_guard.py \
            db/session.py \
            bot/middlewares/db.py \
            db/migrations/versions/030_feed_engagements.py \
            tests/test_feed_engagement_security.py \
            tests/test_password_rate_limit_redis.py

      - name: Compile security modules
        run: |
          python -m py_compile \
            api/web/auth_rate_limit_guard.py \
            core/password_rate_limit.py \
            core/request_identity.py \
            db/feed_engagement.py \
            db/feed_engagement_guard.py \
            db/session.py \
            bot/middlewares/db.py \
            db/migrations/versions/030_feed_engagements.py

      - name: Security regression tests
        run: |
          pytest -q \
            tests/test_feed_engagement_security.py \
            tests/test_password_rate_limit_redis.py \
            tests/test_repository_feed.py
