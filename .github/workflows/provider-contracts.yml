name: Provider Contract Compliance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456:ci-provider-contracts"
      COMET_API_KEY: "ci-provider-contracts"
      DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile provider contract modules
        run: |
          python -m compileall -q \
            api/provider_billing.py \
            api/provider_contract_catalog.py \
            api/provider_operation_bindings.py \
            api/provider_operation_registry.py \
            api/provider_smoke_manifest.py \
            api/web/provider_operations.py \
            bot/services/generation_service.py \
            scripts/check_provider_contract_coverage.py \
            scripts/check_provider_contracts_ci.py \
            scripts/check_provider_product_readiness.py \
            scripts/run_provider_live_smoke.py

      - name: Ruff provider integration
        run: |
          ruff check \
            api/provider_billing.py \
            api/provider_contract_catalog.py \
            api/provider_operation_bindings.py \
            api/provider_operation_registry.py \
            api/provider_smoke_manifest.py \
            api/web/provider_operations.py \
            bot/services/generation_service.py \
            scripts/check_provider_contract_coverage.py \
            scripts/check_provider_contracts_ci.py \
            scripts/check_provider_product_readiness.py \
            scripts/run_provider_live_smoke.py \
            tests/test_provider_contract_catalog.py \
            tests/test_provider_operation_gateway.py

      - name: Structural provider inventory
        run: python scripts/check_provider_contracts_ci.py

      - name: Strict product readiness
        run: python scripts/check_provider_product_readiness.py

      - name: Live smoke manifest validation
        run: python scripts/run_provider_live_smoke.py

      - name: Provider contract tests
        run: |
          pytest -q \
            tests/test_provider_contract_catalog.py \
            tests/test_provider_operation_gateway.py \
            tests/test_provider_spec_p0.py \
            tests/test_image_provider_contracts.py \
            tests/test_gpt_image_2_references.py \
            tests/test_advanced_video_service.py \
            tests/test_kling_grok_service.py \
            tests/test_suno_full_service.py \
            tests/test_midjourney_full_service.py \
            tests/test_llm_provider_contracts.py \
            tests/test_moderation_review_contract.py
