name: APIX CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff maintained baseline
        run: |
          ruff check \
            api/assistant_service.py \
            api/image_service.py \
            api/photo_prompt_service.py \
            api/video_service.py \
            bot/handlers/video_gen.py \
            tests/test_midjourney.py \
            tests/test_photo_prompt_service.py \
            tests/test_video_gen.py \
            tests/test_webapp_routes.py \
            tests/test_kie_model_specs.py

      - name: Pytest
        run: pytest -q

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow/webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: artflow/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - webapp
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy APIX via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LENA_HOST || secrets.DEPLOY_HOST }}
          port: ${{ secrets.LENA_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.LENA_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/mkdir/lena_bot
            git fetch --all
            git pull --ff-only origin main
            cd artflow
            docker compose up -d --build
            sleep 3
            docker compose ps
            curl -fsS https://apixbotai.com/api/v1/health
