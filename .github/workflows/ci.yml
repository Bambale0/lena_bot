name: APIX CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: write

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apix_session_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apix_session_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_RECONCILIATION_POSTGRES_DSN: "postgresql://postgres:postgres@127.0.0.1:5432/apix_session_migration_test"
      APIX_TEST_NGINX_IMAGE: "nginx:alpine"
      APIX_TEST_POSTGRES_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/apix_session_migration_test"
      BOT_TOKEN: "123456:ci-backend-quality"
      COMET_API_KEY: "ci-backend-quality"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/ci"
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare canonical Nginx syntax test image
        timeout-minutes: 3
        run: docker pull nginx:alpine

      - name: Ruff full application
        run: ruff check .

      - name: Provider contract inventory
        run: python scripts/check_provider_contracts_ci.py

      - name: Deploy script contract
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy-production.sh
          ruff check tests/test_production_env_contract.py
          python -m unittest discover -s tests -p test_production_env_contract.py -v
          grep -Fq 'docker compose run --rm -T app alembic upgrade head </dev/null' scripts/deploy-production.sh
          grep -Fq 'verifying Seedance 2.5 feed-repeat runtime and Telegram webhook' scripts/deploy-production.sh

      - name: Native admission fallback regressions
        run: pytest -q tests/test_neironych_admission_fallback.py tests/test_neironych_qwen38_service.py

      - name: Pytest full release gate
        run: pytest -q

  bot-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: "123456:ci-navigation"
      COMET_API_KEY: "ci-navigation"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/ci"
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Genjutsu editor lint
        run: ruff check bot/handlers/genjutsu_replace.py core/seedance_repeat_overrides.py tests/test_genjutsu_face_clothing.py tests/test_genjutsu_replace_bot.py
      - name: Navigation regressions
        run: |
          pytest -q tests/test_genjutsu_face_clothing.py tests/test_genjutsu_replace_bot.py tests/test_seedance25_identity_transfer.py tests/test_seedance25_provider_payload.py tests/test_video_runtime_fixes.py tests/test_genjutsu_integration.py tests/test_navigation_flows.py tests/test_video_gen.py tests/test_video_wizard_v2.py tests/test_photo_prompt_bot_integration.py tests/test_image_wizard_v2.py tests/test_midjourney.py tests/test_plan_payment_method_choice.py tests/test_main_menu_contract.py tests/test_callback_coverage.py tests/test_generation_task_reference.py tests/test_kie_webhook.py tests/test_music_webhook.py

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow/webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: artflow/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pending payment state regressions
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Playwright Mini App smoke
        run: npm run test:e2e

      - name: Playwright UX2 admin preview regressions
        if: ${{ !cancelled() }}
        run: npm run test:e2e:ux2

      - name: Install WebKit for feed video regressions
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps webkit

      - name: Playwright feed video first frames (WebKit)
        if: ${{ !cancelled() }}
        run: npx playwright test -c playwright.feed-video.config.ts

      - name: UX2 preview screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apix-ux2-preview
          path: artflow/webapp/test-results/
          retention-days: 3
          if-no-files-found: ignore

  deploy:
    name: Production Autodeploy
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - webapp
      - bot-navigation
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 35
    environment:
      name: production
    concurrency:
      group: apix-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.LENA_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.LENA_SSH_KEY || secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.LENA_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/mkdir/lena_bot' }}
      DEPLOY_APP_SUBDIR: ${{ vars.DEPLOY_APP_SUBDIR || 'artflow' }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
      DEPLOY_PUBLIC_HEALTH_URL: ${{ vars.DEPLOY_PUBLIC_HEALTH_URL || 'https://apixbotai.com/api/v1/health' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require provider checks on the deployment SHA
        uses: actions/github-script@v7
        with:
          script: |
            // This check runs in a separate workflow; never deploy before it passes.
            for (let attempt = 0; attempt < 120; attempt++) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref: context.sha, filter: 'latest', per_page: 100
              });
              const check = checks.find(c => c.name === 'provider-contracts' && c.app?.slug === 'github-actions');
              if (check?.status === 'completed') {
                if (check.conclusion !== 'success') {
                  throw new Error(`Provider contracts did not pass: ${check.conclusion}`);
                }
                core.info(`Provider contracts passed for ${context.sha}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Timed out waiting for provider contracts on ${context.sha}`);

      - name: Mark production deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(printf '{"state":"pending","context":"production/deploy","description":"Production deployment in progress","target_url":"%s"}' "$run_url")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Deployment preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "branch=${DEPLOY_BRANCH}"
          echo "path=${DEPLOY_PATH}/${DEPLOY_APP_SUBDIR}"
          echo "health=${DEPLOY_PUBLIC_HEALTH_URL}"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Missing production secret LENA_HOST or DEPLOY_HOST}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing deployment SSH private key}"
          : "${DEPLOY_USER:?Missing production variable DEPLOY_USER}"
          : "${DEPLOY_PORT:?Missing production variable DEPLOY_PORT}"
          : "${DEPLOY_PATH:?Missing production variable DEPLOY_PATH}"
          : "${DEPLOY_APP_SUBDIR:?Missing production variable DEPLOY_APP_SUBDIR}"
          : "${DEPLOY_BRANCH:?Missing production variable DEPLOY_BRANCH}"
          : "${DEPLOY_PUBLIC_HEALTH_URL:?Missing production variable DEPLOY_PUBLIC_HEALTH_URL}"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GITHUB_SHA must be a full 40-character Git commit SHA" >&2
            exit 1
          }

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy APIX via SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          remote_script="/tmp/apix-deploy-${GITHUB_SHA}.sh"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          # Upload first, execute second. The remote Bash must never parse the
          # deployment program from stdin: docker/compose child processes are
          # allowed to own stdin without being able to consume future commands.
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > '$remote_script' && chmod 700 '$remote_script'" \
            < artflow/scripts/deploy-production.sh

          printf -v remote_command \
            'DEPLOY_PATH=%q DEPLOY_APP_SUBDIR=%q DEPLOY_BRANCH=%q DEPLOY_PUBLIC_HEALTH_URL=%q bash %q %q; rc=$?; rm -f %q; exit $rc' \
            "$DEPLOY_PATH" "$DEPLOY_APP_SUBDIR" "$DEPLOY_BRANCH" "$DEPLOY_PUBLIC_HEALTH_URL" \
            "$remote_script" "$GITHUB_SHA" "$remote_script"

          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"

      - name: Verify public production health
        shell: bash
        run: |
          set -Eeuo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 15 \
            "$DEPLOY_PUBLIC_HEALTH_URL" >/dev/null

      - name: Record deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## APIX production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Target path: \`${DEPLOY_PATH}/${DEPLOY_APP_SUBDIR}\`"
            echo "- Branch: \`${DEPLOY_BRANCH}\`"
            echo "- Health: \`${DEPLOY_PUBLIC_HEALTH_URL}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish production deploy result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state="failure"
          description="Production deployment failed"
          if [ "$DEPLOY_JOB_STATUS" = "success" ]; then
            state="success"
            description="Production deployment succeeded"
          fi
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(printf '{"state":"%s","context":"production/deploy","description":"%s","target_url":"%s"}' "$state" "$description" "$run_url")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
