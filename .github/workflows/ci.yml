name: APIX CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff maintained baseline
        run: |
          ruff check \
            api/assistant_service.py \
            api/advanced_video_service.py \
            api/image_service.py \
            api/kling_grok_service.py \
            api/llm_provider_service.py \
            api/media_gateway.py \
            api/midjourney_full_service.py \
            api/midjourney_service.py \
            api/photo_prompt_service.py \
            api/provider_contract_catalog.py \
            api/provider_spec_overrides.py \
            api/suno_full_service.py \
            api/video_service.py \
            bot/handlers/video_gen.py \
            scripts/check_provider_contract_coverage.py \
            scripts/check_provider_contracts_ci.py \
            tests/test_midjourney.py \
            tests/test_photo_prompt_service.py \
            tests/test_provider_contract_catalog.py \
            tests/test_video_gen.py \
            tests/test_webapp_routes.py \
            tests/test_kie_model_specs.py

      - name: Provider contract inventory
        run: python scripts/check_provider_contracts_ci.py

      - name: Pytest
        run: pytest -q

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow/webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: artflow/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - webapp
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy APIX via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LENA_HOST || secrets.DEPLOY_HOST }}
          port: ${{ secrets.LENA_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.LENA_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/mkdir/lena_bot
            git fetch --all
            git pull --ff-only origin main
            docker run --rm \
              -v "$PWD/artflow/webapp:/app" \
              -w /app \
              node:22-alpine \
              sh -lc "npm ci && npm run build"
            cd artflow
            docker compose up -d --build
            docker compose ps
            for i in $(seq 1 20); do
              if curl -fsS https://apixbotai.com/api/v1/health; then
                exit 0
              fi
              echo "Waiting for APIX healthcheck ($i/20)..."
              sleep 3
            done
            docker compose logs --tail=120 app
            exit 1
