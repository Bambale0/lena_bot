name: APIX CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456:ci-backend-quality"
      COMET_API_KEY: "ci-backend-quality"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/ci"
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff maintained baseline
        run: |
          ruff check \
            api/assistant_service.py \
            api/advanced_video_service.py \
            api/image_service.py \
            api/kling_grok_service.py \
            api/kling_motion_visibility.py \
            api/llm_provider_service.py \
            api/media_gateway.py \
            api/midjourney_full_service.py \
            api/midjourney_service.py \
            api/nexusapi_client.py \
            api/photo_prompt_service.py \
            api/provider_contract_catalog.py \
            api/provider_spec_overrides.py \
            api/suno_full_service.py \
            api/video_service.py \
            bot/handlers/gemini_omni_recovery.py \
            bot/handlers/gemini_omni_references.py \
            bot/handlers/nexus_test.py \
            bot/handlers/nexus_seedance_test.py \
            bot/handlers/video_gen.py \
            bot/handlers/video_references.py \
            scripts/check_provider_contract_coverage.py \
            scripts/check_provider_contracts_ci.py \
            scripts/verify_seedance25_production.py \
            tests/test_gemini_omni_telegram_media_flow.py \
            tests/test_kling_motion_visibility.py \
            tests/test_admin_main_menu.py \
            tests/test_nexusapi_client.py \
            tests/test_nexus_image_migration.py \
            tests/test_nexus_admin_pricing.py \
            tests/test_midjourney.py \
            tests/test_photo_prompt_service.py \
            tests/test_provider_contract_catalog.py \
            tests/test_seedance25_repeat_keyboard.py \
            tests/test_trend_animals_category.py \
            tests/test_video_gen.py \
            tests/test_webapp_routes.py \
            tests/test_kie_model_specs.py \
            tests/test_miniapp_feed_webkit_stability.py

      - name: Provider contract inventory
        run: python scripts/check_provider_contracts_ci.py

      - name: Deploy script contract
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy-production.sh
          grep -Fq 'docker compose run --rm -T app alembic upgrade head </dev/null' scripts/deploy-production.sh
          grep -Fq 'verifying Seedance 2.5 feed-repeat runtime and Telegram webhook' scripts/deploy-production.sh

      - name: Pytest maintained PR gate
        run: |
          pytest -q \
            tests/test_apix_legacy_concept_runtime.py \
            tests/test_apix_production_trends_surface.py \
            tests/test_gemini_omni_telegram_media_flow.py \
            tests/test_kling_motion_visibility.py \
            tests/test_admin_main_menu.py \
            tests/test_nexusapi_client.py \
            tests/test_nexus_image_migration.py \
            tests/test_nexus_admin_pricing.py \
            tests/test_miniapp_feed_webkit_stability.py \
            tests/test_provider_contract_catalog.py \
            tests/test_seedance25_repeat_keyboard.py \
            tests/test_trend_animals_category.py \
            tests/test_kie_model_specs.py

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow/webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: artflow/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Playwright Mini App smoke
        run: npm run test:e2e

  deploy:
    name: Production Autodeploy
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - webapp
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 35
    environment:
      name: production
    concurrency:
      group: apix-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.LENA_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.LENA_SSH_KEY || secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.LENA_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/mkdir/lena_bot' }}
      DEPLOY_APP_SUBDIR: ${{ vars.DEPLOY_APP_SUBDIR || 'artflow' }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
      DEPLOY_PUBLIC_HEALTH_URL: ${{ vars.DEPLOY_PUBLIC_HEALTH_URL || 'https://apixbotai.com/api/v1/health' }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark production deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(printf '{"state":"pending","context":"production/deploy","description":"Production deployment in progress","target_url":"%s"}' "$run_url")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Deployment preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "branch=${DEPLOY_BRANCH}"
          echo "path=${DEPLOY_PATH}/${DEPLOY_APP_SUBDIR}"
          echo "health=${DEPLOY_PUBLIC_HEALTH_URL}"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Missing production secret LENA_HOST or DEPLOY_HOST}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing deployment SSH private key}"
          : "${DEPLOY_USER:?Missing production variable DEPLOY_USER}"
          : "${DEPLOY_PORT:?Missing production variable DEPLOY_PORT}"
          : "${DEPLOY_PATH:?Missing production variable DEPLOY_PATH}"
          : "${DEPLOY_APP_SUBDIR:?Missing production variable DEPLOY_APP_SUBDIR}"
          : "${DEPLOY_BRANCH:?Missing production variable DEPLOY_BRANCH}"
          : "${DEPLOY_PUBLIC_HEALTH_URL:?Missing production variable DEPLOY_PUBLIC_HEALTH_URL}"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GITHUB_SHA must be a full 40-character Git commit SHA" >&2
            exit 1
          }

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy APIX via SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          remote_script="/tmp/apix-deploy-${GITHUB_SHA}.sh"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          # Upload first, execute second. The remote Bash must never parse the
          # deployment program from stdin: docker/compose child processes are
          # allowed to own stdin without being able to consume future commands.
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > '$remote_script' && chmod 700 '$remote_script'" \
            < artflow/scripts/deploy-production.sh

          printf -v remote_command \
            'DEPLOY_PATH=%q DEPLOY_APP_SUBDIR=%q DEPLOY_BRANCH=%q DEPLOY_PUBLIC_HEALTH_URL=%q bash %q %q; rc=$?; rm -f %q; exit $rc' \
            "$DEPLOY_PATH" "$DEPLOY_APP_SUBDIR" "$DEPLOY_BRANCH" "$DEPLOY_PUBLIC_HEALTH_URL" \
            "$remote_script" "$GITHUB_SHA" "$remote_script"

          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"

      - name: Verify public production health
        shell: bash
        run: |
          set -Eeuo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 15 \
            "$DEPLOY_PUBLIC_HEALTH_URL" >/dev/null

      - name: Record deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## APIX production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Target path: \`${DEPLOY_PATH}/${DEPLOY_APP_SUBDIR}\`"
            echo "- Branch: \`${DEPLOY_BRANCH}\`"
            echo "- Health: \`${DEPLOY_PUBLIC_HEALTH_URL}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish production deploy result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state="failure"
          description="Production deployment failed"
          if [ "$DEPLOY_JOB_STATUS" = "success" ]; then
            state="success"
            description="Production deployment succeeded"
          fi
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(printf '{"state":"%s","context":"production/deploy","description":"%s","target_url":"%s"}' "$state" "$description" "$run_url")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
