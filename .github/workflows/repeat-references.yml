name: Repeat Reference Flows

on:
  pull_request:
    paths:
      - "artflow/bot/handlers/__init__.py"
      - "artflow/bot/handlers/repeat_references.py"
      - "artflow/bot/handlers/repeat_reference_marketplace.py"
      - "artflow/tests/test_repeat_multiple_references.py"
      - "artflow/tests/test_repeat_marketplace_multiple_references.py"
      - ".github/workflows/repeat-references.yml"

jobs:
  repeat-references:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile repeat flow
        run: |
          python -m compileall -q \
            bot/handlers/repeat_references.py \
            bot/handlers/repeat_reference_marketplace.py \
            tests/test_repeat_multiple_references.py \
            tests/test_repeat_marketplace_multiple_references.py

      - name: Ruff repeat flow
        run: |
          ruff check \
            bot/handlers/__init__.py \
            bot/handlers/repeat_references.py \
            bot/handlers/repeat_reference_marketplace.py \
            tests/test_repeat_multiple_references.py \
            tests/test_repeat_marketplace_multiple_references.py

      - name: Repeat flow regression tests
        run: |
          pytest -q \
            tests/test_repeat_multiple_references.py \
            tests/test_repeat_marketplace_multiple_references.py \
            tests/test_image_gen_references.py \
            tests/test_marketplace_feed_repeat.py \
            tests/test_callback_coverage.py
