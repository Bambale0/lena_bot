name: Repeat Reference Flows

on:
  pull_request:
    paths:
      - "artflow/api/pinterest_contract.py"
      - "artflow/api/repeat_runtime.py"
      - "artflow/bot/handlers/__init__.py"
      - "artflow/bot/handlers/repeat_callback_guard.py"
      - "artflow/bot/handlers/repeat_safe.py"
      - "artflow/bot/handlers/repeat_references.py"
      - "artflow/bot/handlers/repeat_reference_marketplace.py"
      - "artflow/bot/services/safe_repeat_ui.py"
      - "artflow/db/repeat_lookup.py"
      - "artflow/tests/test_repeat_callback_guard.py"
      - "artflow/tests/test_repeat_lookup_db_ids.py"
      - "artflow/tests/test_repeat_multiple_references.py"
      - "artflow/tests/test_repeat_marketplace_multiple_references.py"
      - "artflow/tests/test_image_model_selection_contract.py"
      - "artflow/tests/test_safe_image_repeat.py"
      - "artflow/tests/test_safe_repeat_ui.py"
      - "artflow/tests/test_pinterest_reference_contract.py"
      - ".github/workflows/repeat-references.yml"

jobs:
  repeat-references:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile repeat flow
        run: |
          python -m compileall -q \
            api/pinterest_contract.py \
            api/repeat_runtime.py \
            bot/handlers/repeat_callback_guard.py \
            bot/handlers/repeat_safe.py \
            bot/handlers/repeat_references.py \
            bot/handlers/repeat_reference_marketplace.py \
            bot/services/safe_repeat_ui.py \
            db/repeat_lookup.py \
            tests/test_repeat_callback_guard.py \
            tests/test_repeat_lookup_db_ids.py \
            tests/test_safe_image_repeat.py \
            tests/test_safe_repeat_ui.py \
            tests/test_pinterest_reference_contract.py \
            tests/test_repeat_multiple_references.py \
            tests/test_repeat_marketplace_multiple_references.py \
            tests/test_image_model_selection_contract.py

      - name: Collect Ruff diagnostics
        continue-on-error: true
        run: |
          ruff check \
            api/pinterest_contract.py \
            api/repeat_runtime.py \
            bot/handlers/__init__.py \
            bot/handlers/repeat_callback_guard.py \
            bot/handlers/repeat_safe.py \
            bot/handlers/repeat_references.py \
            bot/handlers/repeat_reference_marketplace.py \
            bot/services/safe_repeat_ui.py \
            db/repeat_lookup.py \
            tests/test_repeat_callback_guard.py \
            tests/test_repeat_lookup_db_ids.py \
            tests/test_safe_image_repeat.py \
            tests/test_safe_repeat_ui.py \
            tests/test_pinterest_reference_contract.py \
            tests/test_repeat_multiple_references.py \
            tests/test_repeat_marketplace_multiple_references.py \
            tests/test_image_model_selection_contract.py \
            --per-file-ignores "api/pinterest_contract.py:I001,bot/handlers/repeat_safe.py:I001,bot/handlers/repeat_references.py:I001,db/repeat_lookup.py:I001" \
            --output-format=json > repeat-ruff.json

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeat-ruff-diagnostics
          path: artflow/repeat-ruff.json
          if-no-files-found: error

      - name: Enforce Ruff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          issues = json.loads(Path("repeat-ruff.json").read_text(encoding="utf-8"))
          if issues:
              for issue in issues:
                  location = issue.get("location") or {}
                  print(
                      f"{issue.get('filename')}:{location.get('row')}:{location.get('column')} "
                      f"{issue.get('code')} {issue.get('message')}"
                  )
              raise SystemExit(1)
          PY

      - name: Repeat flow regression tests
        run: |
          pytest -q \
            tests/test_repeat_callback_guard.py \
            tests/test_repeat_lookup_db_ids.py \
            tests/test_safe_image_repeat.py \
            tests/test_safe_repeat_ui.py \
            tests/test_pinterest_reference_contract.py \
            tests/test_repeat_multiple_references.py \
            tests/test_repeat_marketplace_multiple_references.py \
            tests/test_image_gen_references.py \
            tests/test_image_model_selection_contract.py \
            tests/test_marketplace_feed_repeat.py \
            tests/test_callback_coverage.py \
            --deselect tests/test_image_gen_references.py::test_model_selection_opens_task_first_composer_for_any_model
