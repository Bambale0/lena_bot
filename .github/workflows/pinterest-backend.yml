name: Pinterest Backend Contract

on:
  pull_request:
    paths:
      - "artflow/api/__init__.py"
      - "artflow/api/pinterest_contract.py"
      - "artflow/api/pinterest_service_contract.py"
      - "artflow/api/pinterest_service_routes.py"
      - "artflow/api/miniapp_routes.py"
      - "artflow/bot/ui/main_menu.py"
      - "artflow/tests/test_pinterest_backend_parity.py"
      - "artflow/tests/test_pinterest_reference_contract.py"
      - "artflow/tests/test_pinterest_telegram_entry.py"
      - ".github/workflows/pinterest-backend.yml"
  push:
    branches: [main]
    paths:
      - "artflow/api/__init__.py"
      - "artflow/api/pinterest_contract.py"
      - "artflow/api/pinterest_service_contract.py"
      - "artflow/api/pinterest_service_routes.py"
      - "artflow/api/miniapp_routes.py"
      - "artflow/bot/ui/main_menu.py"
      - "artflow/tests/test_pinterest_backend_parity.py"
      - "artflow/tests/test_pinterest_reference_contract.py"
      - "artflow/tests/test_pinterest_telegram_entry.py"
      - ".github/workflows/pinterest-backend.yml"
  workflow_dispatch:

jobs:
  pinterest-backend:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456:ci-pinterest-backend"
      COMET_API_KEY: "ci-pinterest-backend"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/ci"
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Pinterest service
        run: |
          python -m py_compile \
            api/pinterest_service_contract.py \
            api/pinterest_service_routes.py \
            bot/ui/main_menu.py

      - name: Ruff Pinterest service
        run: |
          ruff check \
            api/pinterest_service_contract.py \
            api/pinterest_service_routes.py \
            bot/ui/main_menu.py \
            tests/test_pinterest_backend_parity.py \
            tests/test_pinterest_reference_contract.py \
            tests/test_pinterest_telegram_entry.py

      - name: Pinterest service regression tests
        run: |
          pytest -q \
            tests/test_pinterest_backend_parity.py \
            tests/test_pinterest_reference_contract.py \
            tests/test_pinterest_telegram_entry.py
