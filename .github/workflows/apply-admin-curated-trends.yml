name: Apply Admin Curated Trends

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/admin-curated-trends'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-curated-trends
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore migration script
        run: |
          cat .github/admin-curated-trends.part1 \
              .github/admin-curated-trends.part2 \
              .github/admin-curated-trends.part3 \
              .github/admin-curated-trends.part4 \
            | base64 --decode | gzip --decompress > /tmp/apply_curated_trends.py
          python -m py_compile /tmp/apply_curated_trends.py

      - name: Apply curated trends integration
        run: python /tmp/apply_curated_trends.py

      - name: Install backend dependencies
        run: pip install -r artflow/requirements.txt

      - name: Validate backend
        working-directory: artflow
        run: |
          python -m py_compile \
            core/trends.py \
            api/trends_routes.py \
            api/miniapp_routes.py \
            bot/handlers/trends.py \
            bot/handlers/start.py \
            bot/handlers/feed.py \
            main.py
          pytest -q tests/test_admin_curated_trends.py tests/test_deep_links.py tests/test_feed.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: artflow/webapp/package-lock.json

      - name: Build Mini App
        working-directory: artflow/webapp
        run: |
          npm ci
          npm run build

      - name: Commit integration
        run: |
          rm -f \
            .github/admin-curated-trends.part1 \
            .github/admin-curated-trends.part2 \
            .github/admin-curated-trends.part3 \
            .github/admin-curated-trends.part4 \
            .github/workflows/apply-admin-curated-trends.yml
          git config user.name 'APIX Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make trends admin-curated templates'
          git push origin HEAD:agent/admin-curated-trends
