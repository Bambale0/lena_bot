name: Integrate Trends Once

on:
  push:
    branches:
      - agent/integrate-trends

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-trends
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply trends integration
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"Replacement marker not found in {path}: expected {count}, got {actual}\n{old[:240]}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          replace(
              "artflow/bot/ui/main_menu.py",
              '''    builder.row(
                  InlineKeyboardButton(text="📂 " + ("Мои работы" if lang == "ru" else "My work"), callback_data="menu:history"),
                  InlineKeyboardButton(text="🔥 " + ("Лента идей" if lang == "ru" else "Ideas feed"), callback_data="menu:feed"),
              )
              builder.row(
                  InlineKeyboardButton(text="💋 " + (f"Баланс · {context.balance}" if lang == "ru" else f"Balance · {context.balance}"), callback_data="menu:balance"),
''',
              '''    builder.row(
                  InlineKeyboardButton(text="📂 " + ("Мои работы" if lang == "ru" else "My work"), callback_data="menu:history"),
                  InlineKeyboardButton(text="🔥 " + ("Лента идей" if lang == "ru" else "Ideas feed"), callback_data="menu:feed"),
              )
              builder.row(
                  InlineKeyboardButton(text="👑 " + ("Тренды" if lang == "ru" else "Trends"), callback_data="menu:top_day"),
              )
              builder.row(
                  InlineKeyboardButton(text="💋 " + (f"Баланс · {context.balance}" if lang == "ru" else f"Balance · {context.balance}"), callback_data="menu:balance"),
''',
          )

          replace(
              "artflow/bot/keyboards/feed.py",
              '''    if can_delete:
                  builder.row(
                      InlineKeyboardButton(text="🗑 Удалить из ленты", callback_data=f"feed:remove:{gen_id}:{source}:{index}"),
                  )
              builder.row(
                  InlineKeyboardButton(text="📚 Библиотека промптов", callback_data="menu:prompts"),
''',
              '''    if can_delete:
                  builder.row(
                      InlineKeyboardButton(text="🗑 Удалить из ленты", callback_data=f"feed:remove:{gen_id}:{source}:{index}"),
                  )
              builder.row(
                  InlineKeyboardButton(
                      text="🔥 Все работы" if source == "top" else "👑 Тренды",
                      callback_data="menu:feed" if source == "top" else "feed:top",
                  ),
              )
              builder.row(
                  InlineKeyboardButton(text="📚 Библиотека промптов", callback_data="menu:prompts"),
''',
          )

          replace(
              "artflow/bot/keyboards/feed.py",
              '''def empty_feed_kb() -> InlineKeyboardMarkup:
              builder = InlineKeyboardBuilder()
              builder.row(InlineKeyboardButton(text="🎨 Создать изображение", callback_data="menu:image"))
              builder.row(InlineKeyboardButton(text="📚 Библиотека промптов", callback_data="menu:prompts"))
              builder.row(InlineKeyboardButton(text="🏠 Главная", callback_data="menu:main"))
              return builder.as_markup()
''',
              '''def empty_feed_kb(*, top_day: bool = False) -> InlineKeyboardMarkup:
              builder = InlineKeyboardBuilder()
              builder.row(InlineKeyboardButton(text="🎨 Создать изображение", callback_data="menu:image"))
              builder.row(
                  InlineKeyboardButton(
                      text="🔥 Все работы" if top_day else "👑 Тренды",
                      callback_data="menu:feed" if top_day else "menu:top_day",
                  )
              )
              builder.row(InlineKeyboardButton(text="📚 Библиотека промптов", callback_data="menu:prompts"))
              builder.row(InlineKeyboardButton(text="🏠 Главная", callback_data="menu:main"))
              return builder.as_markup()
''',
          )

          replace(
              "artflow/bot/handlers/feed.py",
              '    title = "👑 <b>Топ дня</b>" if top_day else "🔥 <b>Лента</b>"\n',
              '    title = "👑 <b>Тренды</b>" if top_day else "🔥 <b>Лента</b>"\n',
          )
          replace(
              "artflow/bot/handlers/feed.py",
              '        reply_markup=empty_feed_kb(),\n',
              '        reply_markup=empty_feed_kb(top_day=top_day),\n',
          )
          replace(
              "artflow/bot/handlers/feed.py",
              '''@router.callback_query(F.data == "menu:top_day")
          @router.callback_query(F.data == "feed:top")
          async def open_top_day(
''',
              '''@router.message(Command("trends"))
          async def open_trends_command(
              message: Message,
              session: AsyncSession,
              state: FSMContext,
              db_user: User | None = None,
          ) -> None:
              await state.clear()
              await show_feed_from_source(
                  holder=message,
                  session=session,
                  source="top",
                  index=0,
                  viewer_user_id=db_user.id if db_user else None,
              )


          @router.callback_query(F.data == "menu:top_day")
          @router.callback_query(F.data == "feed:top")
          async def open_top_day(
''',
          )

          replace(
              "artflow/webapp/src/main.jsx",
              'window.__APIX_MINIAPP_BUILD_ID__ = "20260713-miniapp-asset-cache-bust";',
              'window.__APIX_MINIAPP_BUILD_ID__ = "20260731-trends-v1";',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '''          <button className="toolCard" onClick={() => setScreen("assistant")}><b>AI</b><span>Ассистент по промптам</span></button>
                    <button className="toolCard" onClick={() => setScreen("referrals")}><b>₽</b><span>Партнёрский кабинет</span></button>
''',
              '''          <button className="toolCard" onClick={() => setScreen("assistant")}><b>AI</b><span>Ассистент по промптам</span></button>
                    <button className="toolCard" onClick={() => setScreen("trends")}><b>👑</b><span>Тренды работ</span></button>
                    <button className="toolCard" onClick={() => setScreen("referrals")}><b>₽</b><span>Партнёрский кабинет</span></button>
''',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '''function Feed({ feed, feedLoading, prompts, setScreen, onRemix, onNotice, onRemoved, scope = "all", onPromptUse, onOpenPrompts }) {
            const [mode, setMode] = useState("all");
''',
              '''function Feed({ feed, feedLoading, prompts, setScreen, onRemix, onNotice, onRemoved, scope = "all", onPromptUse, onOpenPrompts, source = "recent", onSourceChange }) {
            const [mode, setMode] = useState("all");
            useEffect(() => setMode("all"), [source]);
''',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '      <h1>{isMjScope ? "Midjourney лента" : "Лента"}</h1>\n',
              '      <h1>{isMjScope ? (source === "top_day" ? "Midjourney тренды" : "Midjourney лента") : (source === "top_day" ? "Тренды" : "Лента")}</h1>\n',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '            <div style={{ fontWeight: 700 }}>{isMjScope ? "Публичные MJ-работы" : "Публичные работы"}</div>\n',
              '            <div style={{ fontWeight: 700 }}>{source === "top_day" ? (isMjScope ? "Популярные MJ-работы сегодня" : "Популярные работы сегодня") : (isMjScope ? "Публичные MJ-работы" : "Публичные работы")}</div>\n',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '''        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                    <button onClick={() => setMode("all")} style={{ flex: 1, padding: "9px 12px", borderRadius: 12, border: `1px solid ${mode === "all" ? "var(--accent-border)" : "var(--border-strong)"}`, background: mode === "all" ? "var(--accent-soft)" : "var(--surface-1)", color: mode === "all" ? "var(--accent-text)" : "var(--text-muted)", fontWeight: 600 }}>Все ({scopedFeed.length})</button>
                    <button onClick={() => setMode("mine")} style={{ flex: 1, padding: "9px 12px", borderRadius: 12, border: `1px solid ${mode === "mine" ? "var(--success-border)" : "var(--border-strong)"}`, background: mode === "mine" ? "var(--success-soft)" : "var(--surface-1)", color: mode === "mine" ? "var(--success)" : "var(--text-muted)", fontWeight: 600 }}>Мои ({myCount})</button>
                  </div>
''',
              '''        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                    <button onClick={() => onSourceChange?.("recent")} style={{ flex: 1, padding: "9px 12px", borderRadius: 12, border: `1px solid ${source !== "top_day" ? "var(--accent-border)" : "var(--border-strong)"}`, background: source !== "top_day" ? "var(--accent-soft)" : "var(--surface-1)", color: source !== "top_day" ? "var(--accent-text)" : "var(--text-muted)", fontWeight: 700 }}>🔥 Все работы</button>
                    <button onClick={() => onSourceChange?.("top_day")} style={{ flex: 1, padding: "9px 12px", borderRadius: 12, border: `1px solid ${source === "top_day" ? "var(--accent-border)" : "var(--border-strong)"}`, background: source === "top_day" ? "var(--accent-soft)" : "var(--surface-1)", color: source === "top_day" ? "var(--accent-text)" : "var(--text-muted)", fontWeight: 700 }}>👑 Тренды</button>
                  </div>
                  <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                    <button onClick={() => setMode("all")} style={{ flex: 1, padding: "9px 12px", borderRadius: 12, border: `1px solid ${mode === "all" ? "var(--accent-border)" : "var(--border-strong)"}`, background: mode === "all" ? "var(--accent-soft)" : "var(--surface-1)", color: mode === "all" ? "var(--accent-text)" : "var(--text-muted)", fontWeight: 600 }}>Все ({scopedFeed.length})</button>
                    <button onClick={() => setMode("mine")} style={{ flex: 1, padding: "9px 12px", borderRadius: 12, border: `1px solid ${mode === "mine" ? "var(--success-border)" : "var(--border-strong)"}`, background: mode === "mine" ? "var(--success-soft)" : "var(--surface-1)", color: mode === "mine" ? "var(--success)" : "var(--text-muted)", fontWeight: 600 }}>Мои ({myCount})</button>
                  </div>
''',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '''              {mode === "mine" ? "У тебя пока нет работ в ленте. Опубликуй готовую картинку и забери ссылку для репоста." : "Лента пока пустая."}
''',
              '''              {mode === "mine" ? "У тебя пока нет работ в ленте. Опубликуй готовую картинку и забери ссылку для репоста." : source === "top_day" ? "Сегодня в трендах пока нет опубликованных работ." : "Лента пока пустая."}
''',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '  const [feedScope, setFeedScope] = useState("all");\n',
              '  const [feedScope, setFeedScope] = useState("all");\n  const [feedSource, setFeedSource] = useState("recent");\n',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '  const feed = useApi(() => api("/feed?limit=10000").then(items), fallbackFeed);\n',
              '  const feed = useApi(() => api("/feed?source=recent&limit=10000").then(items), fallbackFeed);\n  const trends = useApi(() => api("/feed?source=top_day&limit=10000").then(items), fallbackFeed);\n',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '''  function navigate(nextScreen) {
              if (nextScreen === "feed") setFeedScope("all");
              if (nextScreen === "history") setHistoryScope("all");
              if (nextScreen === "prompts") setPromptTarget("studio");
              setScreen(nextScreen);
            }
''',
              '''  function navigate(nextScreen) {
              if (nextScreen === "trends") {
                setFeedScope("all");
                setFeedSource("top_day");
                setScreen("feed");
                return;
              }
              if (nextScreen === "feed") {
                setFeedScope("all");
                setFeedSource("recent");
              }
              if (nextScreen === "history") setHistoryScope("all");
              if (nextScreen === "prompts") setPromptTarget("studio");
              setScreen(nextScreen);
            }
''',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '''  function openFeed(scope = "all") {
              const normalizedScope = scope === "midjourney" ? "midjourney" : "all";
              setFeedScope(normalizedScope);
''',
              '''  function openFeed(scope = "all") {
              const normalizedScope = scope === "midjourney" ? "midjourney" : "all";
              setFeedScope(normalizedScope);
              setFeedSource("recent");
''',
          )
          replace(
              "artflow/webapp/src/main.jsx",
              '''    feed: <Feed feed={feed.data} feedLoading={feed.loading} prompts={prompts.data} setScreen={navigate} onRemix={handleRemix} onNotice={setNotice} onRemoved={() => { feed.reload(); myFeed.reload(); }} scope={feedScope} onPromptUse={feedScope === "midjourney" ? openMidjourneyPromptPreset : openPromptPreset} onOpenPrompts={() => openPromptLibrary(feedScope === "midjourney" ? "midjourney" : "studio")} />,
''',
              '''    feed: <Feed feed={feedSource === "top_day" ? trends.data : feed.data} feedLoading={feedSource === "top_day" ? trends.loading : feed.loading} prompts={prompts.data} setScreen={navigate} onRemix={handleRemix} onNotice={setNotice} onRemoved={() => { feed.reload(); trends.reload(); myFeed.reload(); }} scope={feedScope} source={feedSource} onSourceChange={setFeedSource} onPromptUse={feedScope === "midjourney" ? openMidjourneyPromptPreset : openPromptPreset} onOpenPrompts={() => openPromptLibrary(feedScope === "midjourney" ? "midjourney" : "studio")} />,
''',
          )

          tests = ROOT / "artflow/tests/test_trends_surface.py"
          tests.write_text(
              '''from pathlib import Path


ROOT = Path(__file__).resolve().parents[1]


def source(path: str) -> str:
    return (ROOT / path).read_text(encoding="utf-8")


def test_telegram_trends_are_reachable() -> None:
    menu = source("bot/ui/main_menu.py")
    handlers = source("bot/handlers/feed.py")
    keyboard = source("bot/keyboards/feed.py")

    assert 'callback_data="menu:top_day"' in menu
    assert 'Command("trends")' in handlers
    assert 'source="top"' in handlers
    assert 'text="🔥 Все работы" if source == "top" else "👑 Тренды"' in keyboard


def test_miniapp_loads_and_displays_trends() -> None:
    app = source("webapp/src/main.jsx")
    api = source("api/miniapp_routes.py")

    assert '/feed?source=top_day&limit=10000' in app
    assert 'setFeedSource("top_day")' in app
    assert '>👑 Тренды</button>' in app
    assert 'source: str = Query(default="recent", pattern="^(recent|top_day|top)$")' in api
    assert 'repo.get_top_day_generations' in api


def test_miniapp_bundle_id_changes_with_trends_release() -> None:
    app = source("webapp/src/main.jsx")
    assert 'window.__APIX_MINIAPP_BUILD_ID__ = "20260731-trends-v1"' in app
''',
              encoding="utf-8",
          )

          docs = ROOT / "artflow/docs/trends.md"
          docs.write_text(
              '''# Тренды APIX

## Telegram-бот

- Главная кнопка `👑 Тренды` открывает `menu:top_day`.
- Команда `/trends` открывает тот же источник.
- В карточке можно переключаться между `🔥 Все работы` и `👑 Тренды`.
- Источник использует `repo.get_top_day_generations` и ранжирование по вовлечённости.

## Mini App

- На главной добавлена карточка `Тренды работ`.
- Внутри ленты есть переключатель `🔥 Все работы / 👑 Тренды`.
- Тренды загружаются отдельно через `/api/v1/feed?source=top_day`.
- При переходе на тренды меняются заголовок, состояние загрузки и empty state.

## Деплой

Mini App нужно пересобрать. Build ID релиза: `20260731-trends-v1`.
''',
              encoding="utf-8",
          )
          PY

      - name: Compile bot changes
        run: python -m compileall -q artflow/bot/ui/main_menu.py artflow/bot/keyboards/feed.py artflow/bot/handlers/feed.py

      - name: Run trends contract tests
        run: |
          python -m pip install --quiet pytest
          pytest -q artflow/tests/test_trends_surface.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: artflow/webapp/package-lock.json

      - name: Build Mini App
        working-directory: artflow/webapp
        run: |
          npm ci
          npm run build

      - name: Commit integrated feature
        run: |
          rm .github/workflows/integrate-trends-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate trends in bot and mini app"
          git push origin HEAD:agent/integrate-trends
