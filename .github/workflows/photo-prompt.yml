name: Photo Prompt Integration

on:
  push:
    branches: [main]
    paths:
      - "artflow/api/photo_prompt_service.py"
      - "artflow/bot/handlers/photo_prompt.py"
      - "artflow/bot/handlers/__init__.py"
      - "artflow/bot/keyboards/models.py"
      - "artflow/bot/ui/image_menu.py"
      - "artflow/tests/test_photo_prompt_service.py"
      - "artflow/tests/test_photo_prompt_bot_integration.py"
      - ".github/workflows/photo-prompt.yml"
  pull_request:
    paths:
      - "artflow/api/photo_prompt_service.py"
      - "artflow/bot/handlers/photo_prompt.py"
      - "artflow/bot/handlers/__init__.py"
      - "artflow/bot/keyboards/models.py"
      - "artflow/bot/ui/image_menu.py"
      - "artflow/tests/test_photo_prompt_service.py"
      - "artflow/tests/test_photo_prompt_bot_integration.py"
      - ".github/workflows/photo-prompt.yml"

jobs:
  photo-prompt:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile photo prompt modules
        run: |
          python -m compileall -q \
            api/photo_prompt_service.py \
            bot/handlers/photo_prompt.py \
            bot/handlers/__init__.py \
            tests/test_photo_prompt_service.py \
            tests/test_photo_prompt_bot_integration.py

      - name: Ruff photo prompt integration
        run: |
          ruff check \
            api/photo_prompt_service.py \
            bot/handlers/photo_prompt.py \
            bot/handlers/__init__.py \
            tests/test_photo_prompt_service.py \
            tests/test_photo_prompt_bot_integration.py

      - name: Photo prompt tests
        run: |
          pytest -q \
            tests/test_photo_prompt_service.py \
            tests/test_photo_prompt_bot_integration.py
