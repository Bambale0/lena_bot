name: 300 User Journey Integration

on:
  pull_request:
    paths:
      - "artflow/api/miniapp_routes.py"
      - "artflow/api/trends_routes.py"
      - "artflow/api/web/feed.py"
      - "artflow/tests/test_user_journeys_300_integration.py"
      - "artflow/webapp/tests/user-journeys/user-journeys-300.spec.ts"
      - ".github/workflows/user-journeys-integration.yml"
  push:
    branches: [main]
    paths:
      - "artflow/api/miniapp_routes.py"
      - "artflow/api/trends_routes.py"
      - "artflow/api/web/feed.py"
      - "artflow/tests/test_user_journeys_300_integration.py"
      - "artflow/webapp/tests/user-journeys/user-journeys-300.spec.ts"
      - ".github/workflows/user-journeys-integration.yml"
  workflow_dispatch:

jobs:
  integration-journeys:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            artflow/requirements.txt
            artflow/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile integration matrix
        run: python -m compileall -q tests/test_user_journeys_300_integration.py

      - name: Run exactly 300 mapped integration journeys
        run: |
          set -o pipefail
          pytest -q -ra --tb=short tests/test_user_journeys_300_integration.py 2>&1 | tee integration-journeys.log

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-journeys-diagnostics
          path: artflow/integration-journeys.log
          if-no-files-found: error
