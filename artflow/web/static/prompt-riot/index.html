<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APIX Prompt Riot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="APIX Prompt Riot home">
        <span class="brand-mark">APIX</span>
        <span class="brand-sub">Prompt Riot Studio</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#/studio">Studio</a>
        <a href="#/prompts">Prompts</a>
        <a href="#/feed">Feed</a>
        <a href="#/works">Works</a>
        <a href="#/billing">Billing</a>
        <a href="#/profile">Profile</a>
      </nav>
      <a class="connect" href="#/auth">Sync</a>
    </header>

    <main id="app" class="app-shell" tabindex="-1"></main>

    <template id="loading-template">
      <section class="screen">
        <article class="paper-card loading-card">
          <p class="sticker cyan">LOADING</p>
          <h1>Pulling fresh Artflow data...</h1>
        </article>
      </section>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
