<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Каталог Tribute | APIX</title>
  <link rel="stylesheet" href="css/prototype-premium.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/tribute-admin.js" defer></script>
  <style>
    .catalog-shell{max-width:760px;margin:32px auto;padding:20px}
    .catalog-form[hidden]{display:none}.catalog-form{display:grid;gap:16px}.catalog-form label{display:grid;gap:6px}
    .catalog-form input,.catalog-form select{box-sizing:border-box;width:100%;min-height:44px}
    .catalog-actions{display:flex;flex-wrap:wrap;gap:12px}.catalog-status{white-space:pre-wrap;overflow-wrap:anywhere;min-height:48px}
    .catalog-form .catalog-toggle{display:flex;align-items:center;gap:12px}.catalog-toggle input{width:24px;min-height:24px}
  </style>
</head>
<body>
<main class="catalog-shell">
  <a href="account.html#admin">← Администрирование</a>
  <h1>Продукты Tribute</h1>
  <p>Каталог для сайта, Mini App и бота. Сохранение проверяет продукт у Tribute; оплату и возврат не выполняет.</p>
  <p>Для новой цены или состава пакета создайте новый product ID. Старый продукт останется доступен для обработки прежних покупок.</p>
  <p id="catalog-status" class="catalog-status" role="status" aria-live="polite">Проверяем доступ…</p>
  <form id="catalog-form" class="catalog-form" hidden>
    <label>Сохранённый продукт<select id="catalog-select" class="admin-input"><option value="">Новый продукт</option></select></label>
    <label>Product ID<input name="product_id" inputmode="numeric" pattern="[0-9]+" required class="admin-input"></label>
    <label>Ключ пакета APIX<input name="plan_key" maxlength="64" required class="admin-input" placeholder="Ключ из прайс-листа"></label>
    <label>Ссылка Tribute<input name="payment_url" type="url" required class="admin-input" placeholder="https://web.tribute.tg/p/…"></label>
    <label>Цена в центах USD<input name="amount_minor" type="number" min="1" step="1" required class="admin-input"><small>Например, 250 означает $2.50.</small></label>
    <label class="catalog-toggle"><input name="enabled" type="checkbox" checked>Предлагать этот продукт при оплате</label>
    <input name="expected_revision" type="hidden" value="0">
    <div class="catalog-actions"><button class="button" type="submit">Проверить и сохранить</button><button class="button ghost" id="catalog-reload" type="button">Обновить каталог</button></div>
  </form>
</main>
</body></html>
