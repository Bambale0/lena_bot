server {
    listen 80;
    server_name media.apixbotai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.apixbotai.com;

    ssl_certificate /etc/letsencrypt/live/media.apixbotai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.apixbotai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    etag on;
    autoindex off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /uploads/ {
        alias /var/www/apix-media/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Timing-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"media"}';
    }

    location / {
        return 404;
    }
}
