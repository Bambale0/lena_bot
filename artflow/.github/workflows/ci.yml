name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-quality:
    runs-on: [self-hosted, linux, x64, apix-ci]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (maintained baseline)
        run: |
          ruff check \
            api/assistant_service.py \
            api/image_service.py \
            api/photo_prompt_service.py \
            api/video_service.py \
            bot/handlers/video_gen.py \
            tests/test_midjourney.py \
            tests/test_photo_prompt_service.py \
            tests/test_video_gen.py \
            tests/test_webapp_routes.py \
            tests/test_kie_model_specs.py

      - name: Pytest
        run: |
          pytest -q

  webapp:
    runs-on: [self-hosted, linux, x64, apix-ci]
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
