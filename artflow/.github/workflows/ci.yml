name: APIX CI/CD

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (maintained baseline)
        run: |
          ruff check \
            api/assistant_service.py \
            api/image_service.py \
            api/photo_prompt_service.py \
            api/video_service.py \
            bot/handlers/video_gen.py \
            tests/test_midjourney.py \
            tests/test_photo_prompt_service.py \
            tests/test_video_gen.py \
            tests/test_webapp_routes.py \
            tests/test_kie_model_specs.py

      - name: Pytest
        run: |
          pytest -q

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Production deploy
    needs: [backend-quality, webapp]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/v2' &&
      vars.AUTODEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, apix]
    environment: production
    concurrency:
      group: apix-production-deploy
      cancel-in-progress: false
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy tested revision
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_APP_SUBDIR: ${{ vars.DEPLOY_APP_SUBDIR }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
          DEPLOY_PUBLIC_HEALTH_URL: ${{ vars.DEPLOY_PUBLIC_HEALTH_URL }}
        run: bash scripts/deploy-production.sh "$GITHUB_SHA"
